server {
    listen 8088;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Accept-Encoding "";

        proxy_redirect / $http_x_ingress_path/;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;

        sub_filter_types *;
        sub_filter 'href="/' "href=\"$http_x_ingress_path/";
        sub_filter 'src="/' "src=\"$http_x_ingress_path/";
        sub_filter '"/api' "\"$http_x_ingress_path/api";
        sub_filter "'/api" "'$http_x_ingress_path/api";
        sub_filter '`/api' "`$http_x_ingress_path/api";
        sub_filter '"/assets' "\"$http_x_ingress_path/assets";
        sub_filter '"/logo-gold.png' "\"$http_x_ingress_path/logo-gold.png";
        sub_filter 'url(/assets' "url($http_x_ingress_path/assets";
        sub_filter 'url("/logo-gold.png")' "url(\"$http_x_ingress_path/logo-gold.png\")";
        sub_filter_once off;

        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors *" always;
    }
}
