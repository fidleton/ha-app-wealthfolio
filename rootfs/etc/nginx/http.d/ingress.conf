server {
    listen 8089;
    server_name _;
    error_log /dev/stderr warn;

    root /var/www/localhost/htdocs;
    index index.html;

    # Belangrijk: Home Assistant Ingress stuurt verzoeken naar een dynamisch subpad (bijv. /api/hassio_ingress/token/)
    # Deze locatie-block vangt alle Ingress-verzoeken op en serveert de index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Voorkom caching zodat wijzigingen in de redirect-URL direct doorkomen
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
